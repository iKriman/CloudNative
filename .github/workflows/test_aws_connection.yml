name: Test AWS Connection

on:
  workflow_dispatch: 

jobs:
  test-connection:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1 

      - name: Test S3 Connection
        run: |
          echo "Listando buckets para verificar credenciales..."
          aws s3 ls
      
      - name: Test SSH to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "Conexión exitosa a la instancia EC2"
            df -h # Verifica si el EFS está montado
            echo "El EFS está montado:"
            ls -la /tu/ruta/de/montaje/efs # Cambia esta ruta por la que configuraste en tu EC2
